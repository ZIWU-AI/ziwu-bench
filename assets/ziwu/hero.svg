<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="t d">
  <title id="t">ZIWU Bench</title>
  <desc id="d">From a scientific proposal to a benchmark-ready task, in one command.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#101a36"/>
      <stop offset="1" stop-color="#0d2a33"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.18" cy="0.15" r="0.55">
      <stop offset="0" stop-color="#6d7cff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6d7cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.92" cy="0.95" r="0.6">
      <stop offset="0" stop-color="#22d3c5" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#22d3c5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#b9c4ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c8cff"/>
      <stop offset="1" stop-color="#2ee6c9"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1280" height="560" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="560" rx="28" fill="url(#grid)"/>
  <rect width="1280" height="560" rx="28" fill="url(#glowA)"/>
  <rect width="1280" height="560" rx="28" fill="url(#glowB)"/>

  <g font-family="Inter, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif">
    <g transform="translate(72 92)">
      <rect width="172" height="32" rx="16" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/>
      <circle cx="18" cy="16" r="5" fill="#2ee6c9"/>
      <text x="32" y="21" font-size="13" font-weight="600" letter-spacing="1.6" fill="#cfd6ff">BY ZIWU · 子午智能</text>
    </g>
    <text x="70" y="208" font-size="84" font-weight="800" letter-spacing="-2.5" fill="url(#title)">ZIWU Bench</text>
    <rect x="74" y="232" width="96" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="72" y="292" font-size="30" font-weight="600" fill="#e8ecff">Your science, turned into an exam</text>
    <text x="72" y="332" font-size="30" font-weight="600" fill="#e8ecff">for frontier AI. In one command.</text>
    <text x="72" y="392" font-size="17" fill="#9aa6d6">proposal.md  →  official task  →  static checks  →  open-model self-test  →  PR</text>
    <g transform="translate(72 430)" font-size="14" font-weight="600">
      <rect width="190" height="36" rx="10" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="95" y="23" text-anchor="middle" fill="#cfd6ff">Terminal-Bench-Science</text>
      <rect x="202" width="92" height="36" rx="10" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="248" y="23" text-anchor="middle" fill="#cfd6ff">Harbor</text>
      <rect x="306" width="130" height="36" rx="10" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="371" y="23" text-anchor="middle" fill="#cfd6ff">Codex · Claude</text>
    </g>
  </g>

  <g transform="translate(700 104)" filter="url(#shadow)">
    <rect width="510" height="352" rx="16" fill="#0a0f1e" stroke="#ffffff" stroke-opacity="0.12"/>
    <path d="M0 16a16 16 0 0 1 16-16h478a16 16 0 0 1 16 16v26H0z" fill="#ffffff" fill-opacity="0.05"/>
    <circle cx="24" cy="21" r="6" fill="#ff5f57"/>
    <circle cx="44" cy="21" r="6" fill="#febc2e"/>
    <circle cx="64" cy="21" r="6" fill="#28c840"/>
    <text x="255" y="26" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#7d88b3">~/research</text>
    <g font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="15">
      <text x="24" y="82"><tspan fill="#2ee6c9">$</tspan><tspan fill="#e8ecff"> npm i -g @ziwu-ai/ziwu-agent</tspan></text>
      <text x="24" y="114"><tspan fill="#2ee6c9">$</tspan><tspan fill="#e8ecff"> ziwu task new </tspan><tspan fill="#b9c4ff">proposal.md</tspan></text>
      <text x="24" y="158" fill="#7d88b3">  reading proposal · building task</text>
      <text x="24" y="190"><tspan fill="#2ee6c9">  ✓</tspan><tspan fill="#cfd6ff"> task files in official format</tspan></text>
      <text x="24" y="218"><tspan fill="#2ee6c9">  ✓</tspan><tspan fill="#cfd6ff"> static checks · all passed</tspan></text>
      <text x="24" y="246"><tspan fill="#2ee6c9">  ✓</tspan><tspan fill="#cfd6ff"> docker · oracle · nop</tspan></text>
      <text x="24" y="274"><tspan fill="#2ee6c9">  ✓</tspan><tspan fill="#cfd6ff"> open-model self-test · reward 1.0</tspan></text>
      <text x="24" y="314"><tspan fill="#7c8cff">  →</tspan><tspan fill="#ffffff" font-weight="700"> ready for GPT &amp; Claude</tspan><tspan fill="#2ee6c9"> ▍</tspan></text>
    </g>
  </g>
</svg>
