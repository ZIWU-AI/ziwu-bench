<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-labelledby="t d">
  <title id="t">ZIWU roadmap</title>
  <desc id="d">From Agent, to Evaluation, to AI Scientist, to Research Lab: many AI scientists plus instruments and automated labs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#132341"/>
    </linearGradient>
    <linearGradient id="track" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2ee6c9"/>
      <stop offset="0.45" stop-color="#7c8cff"/>
      <stop offset="1" stop-color="#7c8cff" stop-opacity="0.15"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="300" rx="24" fill="url(#bg)"/>
  <g font-family="Inter, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="56" y="60" font-size="13" font-weight="700" letter-spacing="2" fill="#7c8cff">WHERE THIS IS GOING</text>
    <rect x="150" y="146" width="980" height="4" rx="2" fill="url(#track)"/>

    <g transform="translate(150 148)">
      <circle r="14" fill="#2ee6c9"/><circle r="24" fill="none" stroke="#2ee6c9" stroke-opacity="0.35" stroke-width="2"/>
      <text y="-42" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1.4" fill="#2ee6c9">SHIPPING</text>
      <text y="58" text-anchor="middle" font-size="21" font-weight="700" fill="#ffffff">Agent</text>
      <text y="84" text-anchor="middle" font-size="13" fill="#9aa6d6">ziwu-agent: every session,</text>
      <text y="102" text-anchor="middle" font-size="13" fill="#9aa6d6">one account, reusable skills</text>
    </g>
    <g transform="translate(477 148)">
      <circle r="14" fill="#2ee6c9"/><circle r="24" fill="none" stroke="#2ee6c9" stroke-opacity="0.35" stroke-width="2"/>
      <text y="-42" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1.4" fill="#2ee6c9">SHIPPING</text>
      <text y="58" text-anchor="middle" font-size="21" font-weight="700" fill="#ffffff">Evaluation</text>
      <text y="84" text-anchor="middle" font-size="13" fill="#9aa6d6">ziwu-bench: proposals become</text>
      <text y="102" text-anchor="middle" font-size="13" fill="#9aa6d6">exams for frontier AI</text>
    </g>
    <g transform="translate(803 148)">
      <circle r="12" fill="#7c8cff"/>
      <text y="-42" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1.4" fill="#9aa6d6">NEXT</text>
      <text y="58" text-anchor="middle" font-size="21" font-weight="700" fill="#ffffff">AI Scientist</text>
      <text y="84" text-anchor="middle" font-size="13" fill="#9aa6d6">agents working inside real</text>
      <text y="102" text-anchor="middle" font-size="13" fill="#9aa6d6">research workflows</text>
    </g>
    <g transform="translate(1130 148)">
      <circle r="12" fill="none" stroke="#7c8cff" stroke-width="3"/>
      <text y="-42" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1.4" fill="#9aa6d6">VISION</text>
      <text y="58" text-anchor="middle" font-size="21" font-weight="700" fill="#ffffff">Research Lab</text>
      <text y="84" text-anchor="middle" font-size="13" fill="#9aa6d6">many AI scientists, instruments</text>
      <text y="102" text-anchor="middle" font-size="13" fill="#9aa6d6">and automated labs</text>
    </g>
  </g>
</svg>
