name: GPU Tools Tests
on:
  pull_request:
    paths: ["tools/mujoco-modal/**", "tools/isaac-reference-modal/**", ".github/workflows/gpu-*.yml", ".github/workflows/upstream-task-bundle.yml"]
  push:
    branches: [main]
    paths: ["tools/mujoco-modal/**", "tools/isaac-reference-modal/**", ".github/workflows/gpu-*.yml", ".github/workflows/upstream-task-bundle.yml"]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m unittest discover -s tools/isaac-reference-modal/tests -v
      - run: python -m unittest discover -s tools/mujoco-modal/tests -v
