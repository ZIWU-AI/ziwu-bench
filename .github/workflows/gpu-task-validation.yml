name: GPU Task Validation
run-name: GPU validation PR ${{ inputs.pr_number }} / ${{ inputs.mode }} / ${{ inputs.gpu }} / ${{ inputs.backend || 'mujoco' }}

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR in this repository (0 = selected workflow revision)"
        type: string
        default: "0"
      backend:
        description: "Simulator (Isaac uses GPU in runner and verifier)"
        type: choice
        options: [mujoco, isaac]
        default: mujoco
      task_path:
        description: "Protected MuJoCo or Isaac task path"
        type: string
        required: true
        default: tasks/engineering-sciences/mechanical-engineering/physicalrsi-bimanual-control
      gpu:
        type: choice
        description: "GPU for NVIDIA rendering"
        options: [L40S, A10]
        default: L40S
      mode:
        type: choice
        description: "Reference and/or negative control"
        options: [all, oracle, nop]
        default: all
      trials:
        description: "Independent repeats (1–3)"
        type: number
        default: 1
  workflow_call:
    inputs:
      backend: {type: string, default: mujoco}
      pr_number: {type: string, default: "0"}
      task_path: {type: string, required: true}
      gpu: {type: string, default: L40S}
      mode: {type: string, default: all}
      trials: {type: number, default: 1}
    secrets:
      MODAL_TOKEN_ID: {required: true}
      MODAL_TOKEN_SECRET: {required: true}

permissions:
  contents: read
  pull-requests: read

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.source.outputs.source_sha }}
      matrix: ${{ steps.source.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Resolve immutable task source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          TASK_PATH: ${{ inputs.task_path }}
          TRIALS: ${{ inputs.trials }}
        run: python tools/mujoco-modal/resolve.py
  validate:
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        trial: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    steps:
      - name: Trusted orchestration
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Candidate task data (never imported on host)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -r tools/mujoco-modal/requirements-host.txt
      - name: Prepare hash-pinned Isaac engine extensions
        if: inputs.backend == 'isaac'
        run: python tools/isaac-reference-modal/prepare_extensions.py --output work/extensions --accept-nvidia-license
      - name: Run GPU reference and fresh data-only verifier
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          TASK_PATH: ${{ inputs.task_path }}
          SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
          GPU: ${{ inputs.gpu }}
          MODE: ${{ inputs.mode }}
          BACKEND: ${{ inputs.backend || 'mujoco' }}
        run: |
          test -n "$MODAL_TOKEN_ID" && test -n "$MODAL_TOKEN_SECRET"
          case "$BACKEND" in
            mujoco) runner=tools/mujoco-modal/run.py; extra=() ;;
            isaac) runner=tools/isaac-reference-modal/run.py; extra=(--extensions work/extensions) ;;
            *) echo 'Unsupported simulator'; exit 1 ;;
          esac
          python "$runner" --task-root candidate --task-path "$TASK_PATH" \
            --source-sha "$SOURCE_SHA" --gpu "$GPU" --mode "$MODE" --output work/run "${extra[@]}"
      - name: Stop this run's sandboxes, including failed phases
        if: always()
        timeout-minutes: 3
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: python tools/mujoco-modal/cleanup.py --run work/run
      - name: Summarize results and package safe evidence
        if: always()
        env:
          BACKEND: ${{ inputs.backend || 'mujoco' }}
          SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
          TASK_PATH: ${{ inputs.task_path }}
        run: python tools/mujoco-modal/report.py --run work/run --output work/report
      - name: Retain reports (numeric oracle recordings are excluded)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-validation-${{ github.run_id }}-${{ matrix.trial }}
          path: work/report/
          retention-days: 30
          if-no-files-found: warn
